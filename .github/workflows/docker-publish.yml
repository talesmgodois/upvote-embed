name: Build, publish and deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-and-publish:
    name: Build & publish Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE_NAME }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::Secret DOCKERHUB_USERNAME is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          NAME="${DOCKERHUB_IMAGE_NAME:-upvote-embed}"
          echo "name=${DOCKERHUB_USERNAME}/${NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Build for both common server architectures; drop arm64 here if
          # your Coolify host only needs amd64, to speed up CI.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

    outputs:
      image: ${{ steps.image.outputs.name }}

  deploy:
    name: Trigger Coolify deployment
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Call Coolify deploy webhook
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_WEBHOOK_TOKEN: ${{ secrets.COOLIFY_WEBHOOK_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ]; then
            echo "Secret COOLIFY_WEBHOOK_URL is not set - skipping deploy trigger."
            exit 0
          fi

          if [ -n "$COOLIFY_WEBHOOK_TOKEN" ]; then
            curl --fail --silent --show-error --location \
              --request POST "$COOLIFY_WEBHOOK_URL" \
              --header "Authorization: Bearer $COOLIFY_WEBHOOK_TOKEN"
          else
            curl --fail --silent --show-error --location \
              --request POST "$COOLIFY_WEBHOOK_URL"
          fi

          echo "Coolify deployment triggered."
